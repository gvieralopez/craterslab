name: QA

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qa:
    uses: gvieralopez/cookie-pyrate/.github/workflows/reusable-qa.yml@v1.1.2
    with:
      cookie-pyrate-ref: v1.1.2
      python-version: "3.11"
      # The classification extra stops at 3.13: TensorFlow has no newer wheels yet
      test-python-versions: '["3.12", "3.13", "3.14", "3.15"]'
